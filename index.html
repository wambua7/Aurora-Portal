<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aurora Login Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Momo+Signature&family=Saira+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#main-login" class="skip-link">Skip to Login</a>
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <main id="main-login" class="glass" aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome Back</h1>
      <p class="subtitle" id="subtitle">Please enter you login credentials to access your account.</p>
      <form action="#" method="post">
        <div class="input-group">
          <label for="email">Email:</label>
          <input type="email" name="email" placeholder="user@example.com" autocomplete="email" required aria-required="true"/>
        </div>
        <div class="input-group">
          <label for="password">Password:</label>
          <input type="password" name="password" placeholder="Enter your password..." autocomplete="current-password" required aria-required="true"/>
        </div>
        <button type="submit">Login</button>
        <p class="subtitle">Don't have an account? <a href="">Register</a></p>
      </form>
    </main>
  </body>
</html>
